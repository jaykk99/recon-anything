# Continuous integration: prove the plugin registry still loads its full
# capability and that the fast, network-free gates pass, on every push and PR.
#
# The headline gate is the plugin-count floor (backend/app/plugins/registry.py
# MIN_PLUGINS). Most plugins are discovered dynamically at import, so a file
# or class count cannot see the real number - only loading the registry can.
# If a category is deleted or a generator breaks, the count drops and this
# fails loudly instead of the tool silently shipping with less.
name: ci

on:
  push:
    branches: [master, main]
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Plugin registry health gate (count floor + import failures)
        run: python -m app.plugins.registry

      - name: Lint gate (no SyntaxWarning - invalid escape sequences)
        run: pytest tests/test_no_syntax_warnings.py -q

      - name: Plugin health tests (import, metadata, unique ids, floor)
        run: pytest tests/test_plugin_health.py -q

      - name: Plugin resilience tests (no plugin throws fatally, network-free)
        run: pytest tests/test_plugin_resilience.py -q

      - name: Batch scanner tests (rules + plugins engines, offline)
        run: pytest tests/test_batch_scan.py -q

      - name: Crawl depth config tests (crawlers honor RECON_CRAWL_* knobs)
        run: pytest tests/test_crawl_depth_config.py -q

      - name: Recursive seeding test (same-origin endpoint recursion)
        run: pytest tests/test_deepcrawl_recursive_seeding.py -q

      - name: Finding-chain invariants (depth fixed, never-a-target blocked)
        run: pytest tests/test_finding_chain_limits.py -q

      - name: RPC dedupe cache (one live call per bytecode/storage word)
        run: pytest tests/test_rpc_cache.py -q

      - name: Detection benchmark (known historical drain classes)
        run: pytest tests/test_detection_benchmark.py -q

      - name: Audit report (EVM + token/market remediation)
        run: pytest tests/test_audit_report.py -q

      - name: Keyword search (find contracts by vuln kind / symbol / plugin)
        run: pytest tests/test_search_keyword.py -q

      - name: Scanner resilience (RPC skip, durable checkpoints, batch lock)
        run: pytest tests/test_scanner_resilience.py -q

  # The per-step gates above are the fast PR check. This runs the WHOLE
  # backend suite (offline-safe: tool- and network-dependent tests skip
  # themselves) so the rest of the suite cannot silently rot again.
  full-suite:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Full backend test suite
        run: pytest tests -q -p no:cacheprovider
