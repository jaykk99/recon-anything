# Render blueprint: ReconAnything UI/API (no workers).
#
# Architecture:
#   - Render  -> serves the UI + API only (RECON_WORKER_ENABLED=0).
#                Creates scan jobs in the Postgres queue.
#   - Railway -> runs the plugin workers (python -m app.worker_main),
#                any number of replicas. Claims jobs via
#                SELECT ... FOR UPDATE SKIP LOCKED.
#   - Neon Postgres (DATABASE_URL) is the shared queue + results store.
#     Scans survive restarts: jobs left queued/running are requeued on boot.
#
# Railway worker service setup (dashboard):
#   - Root directory: backend/
#   - Start command: python -m app.worker_main
#   - Env: DATABASE_URL=<same Neon URL>, RECON_CONCURRENCY=5 (per worker)
#   - No HTTP port needed.
services:
  - type: web
    name: recon-anything
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set in dashboard (Neon Postgres, shared with workers)
      - key: RECON_ACCESS_CODE
        sync: false
      - key: RECON_MASTER_KEY
        sync: false
      - key: RECON_WORKER_ENABLED
        value: "0" # UI only: Railway workers run the queue
      - key: PYTHONUNBUFFERED
        value: "1"
