# Render blueprint: ReconAnything, split into UI/API + worker services.
#
# Architecture (split done 2026-10-20 on Jay's order - scans must never
# block the site he is using):
#   - recon-anything        -> UI + API only (RECON_WORKER_ENABLED=0).
#                              Creates scan jobs in the Postgres queue.
#   - recon-anything-worker -> runs the plugin queue
#                              (python -m app.worker_main). Claims jobs
#                              via SELECT ... FOR UPDATE SKIP LOCKED.
#                              Serves a trivial health page on $PORT so
#                              Render's free web service stays happy;
#                              Both services ping themselves AND each
#                              other every ~4 min (app/keepalive.py), plus
#                              a GitHub Actions cron backstop
#                              (.github/workflows/keepalive.yml).
#   - Neon Postgres (DATABASE_URL) is the shared queue + results store.
#     Scans survive restarts: jobs left queued/running are requeued on boot.
services:
  - type: web
    name: recon-anything
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false # set in dashboard (Neon Postgres, shared with worker)
      - key: RECON_ACCESS_CODE
        sync: false
      - key: RECON_MASTER_KEY
        sync: false
      - key: RECON_WORKER_ENABLED
        value: "0" # UI/API only: the worker service runs the queue
      - key: RECON_WORKER_URL
        sync: false # https://recon-anything-worker.onrender.com (wake ping)
      - key: RECON_KEEPALIVE_S
        value: "240" # pings self + worker every ~4 min (app/keepalive.py)
      # Sellable-product layer (app/billing.py), all optional: unset =
      # honest "opens soon" states, app unchanged. Set in dashboard.
      - key: GITHUB_CLIENT_ID
        sync: false # GitHub OAuth app client id (customer sign-in)
      - key: GITHUB_CLIENT_SECRET
        sync: false # GitHub OAuth app client secret
      - key: RECON_BTC_ADDRESS
        sync: false # BTC address paid plans are paid to (checkout)
      - key: OWNER_GITHUB_LOGIN
        sync: false # optional; defaults to jaykk99 (owner bypass)
      - key: RECON_SESSION_SECRET
        sync: false # optional; session cookie signing secret
      - key: PYTHONUNBUFFERED
        value: "1"
  - type: web
    name: recon-anything-worker
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python -m app.worker_main
    plan: free
    healthCheckPath: /
    envVars:
      - key: RECON_API_PUBLIC_URL
        sync: false # https://recon-anything.onrender.com (worker pings it awake)
      - key: RECON_KEEPALIVE_S
        value: "240" # pings self + API every ~4 min (app/keepalive.py)
      - key: DATABASE_URL
        sync: false # same Neon Postgres as the UI service
      - key: RECON_MASTER_KEY
        sync: false
      - key: PYTHONUNBUFFERED
        value: "1"
